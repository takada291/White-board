<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電子黒板</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004d26">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #222; 
            color: white; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: sans-serif;
        }

        /* 更新通知バー */
        #update-notification {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: #ff9800; color: #000;
            padding: 10px; text-align: center; z-index: 9999;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #update-btn {
            background: #fff; border: 1px solid #333; 
            padding: 2px 10px; margin-left: 10px; cursor: pointer;
            border-radius: 3px;
        }

        /* 簡易通知（トースト） */
        #toast {
            visibility: hidden;
            min-width: 250px;
            margin-left: -125px;
            background-color: rgba(50, 50, 50, 0.9);
            color: #fff;
            text-align: center;
            border-radius: 25px;
            padding: 16px;
            position: fixed;
            z-index: 10000;
            left: 50%;
            bottom: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* 縦画面警告 */
        #portrait-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            text-align: center; flex-direction: column;
        }

        /* メインレイアウト */
        .app-container { display: flex; height: 100%; width: 100%; }

        /* 左側エリア */
        .camera-area {
            flex: 1; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* 5.6m円 描画用オーバーレイ */
        #overlayCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            pointer-events: none;
            z-index: 5;
        }
        #circleHint {
            display: none;
            position: absolute;
            top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #ffd700;
            padding: 8px 20px; border-radius: 25px;
            font-weight: bold; font-size: 1.1rem;
            pointer-events: none; z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* 右側パネル */
        .control-panel {
            width: 320px; background: #333; padding: 10px;
            overflow-y: hidden; 
            border-left: 1px solid #555;
            display: flex; flex-direction: column;
            z-index: 10;
        }

        /* タブ切り替えボタン */
        .tab-header {
            display: flex; gap: 5px; margin-bottom: 10px; flex-shrink: 0;
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; border-radius: 5px;
            font-weight: bold; font-size: 0.9rem; cursor: pointer;
            background-color: #555; color: #ccc; transition: 0.2s;
        }
        .tab-btn.active {
            background-color: #0d6efd; color: white;
        }

        /* タブコンテンツ領域 */
        .tab-content {
            flex: 1; overflow-y: auto; display: none; flex-direction: column;
        }
        .tab-content.active {
            display: flex;
        }

        /* --- 撮影タブ用スタイル --- */
        .shutter-btn-large {
            width: 100%; 
            flex: 1; min-height: 120px;
            background-color: #dc3545; color: white;
            border: none; border-radius: 15px;
            font-weight: bold; font-size: 2rem;
            margin-top: auto; margin-bottom: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .shutter-btn-large:active { transform: scale(0.98); box-shadow: 0 3px 6px rgba(0,0,0,0.5); }

        /* アスペクト比選択ボタン */
        .ratio-group label {
            font-size: 0.9rem; font-weight: bold; padding: 10px 0;
        }
        .btn-check:checked + .btn-outline-light {
            background-color: #0d6efd; border-color: #0d6efd; color: white;
        }
        .btn-outline-light {
            color: #ccc; border-color: #666;
        }

        /* 各種スイッチ大型化 */
        .form-check-input { 
            cursor: pointer; 
            width: 4rem; height: 2rem; 
        }
        .gps-status { font-size: 0.8rem; color: #ffd700; min-height: 1.2em; margin-top: 5px;}

        /* --- 記入タブ用スタイル --- */
        .form-control-sm {
            background-color: #444; color: white; border: 1px solid #666; font-size: 0.9rem; padding: 6px;
        }
        .form-control-sm:focus { background-color: #555; color: white; }
        label { font-size: 0.8rem; color: #ccc; margin-top: 5px; margin-bottom: 2px; }

        .preset-box {
            background: #444; padding: 10px; border-radius: 5px; margin-bottom: 10px;
        }
        .preset-btn-group {
            display: flex; gap: 5px; margin-top: 5px;
        }
        .preset-btn {
            flex: 1; font-size: 0.8rem; padding: 8px; border: none; border-radius: 3px; cursor: pointer;
        }
        .btn-load { background: #0d6efd; color: white; }
        .btn-save { background: #198754; color: white; }

        /* 共通UIパーツ */
        .pos-switch { display: flex; gap: 10px; margin-bottom: 5px; }
        .pos-btn {
            flex: 1; padding: 8px; font-size: 0.9rem;
            background: #555; border: 1px solid #777; color: #aaa;
            text-align: center; border-radius: 5px; cursor: pointer;
        }
        .pos-btn.active { background: #0d6efd; color: white; border-color: #0d6efd; }

        #outputCanvas { display: none; }

        /* プレビュー画面 */
        #previewOverlay {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000;
            flex-direction: row; 
            align-items: center; justify-content: center;
        }
        #previewImg {
            max-width: 75%; max-height: 90%; 
            border: 2px solid white; margin-right: 20px;
        }
        .preview-btns { 
            display: flex; flex-direction: column; gap: 30px; 
        }
        .preview-action-btn {
            padding: 20px 10px; width: 120px;
            border: none; color: white; border-radius: 10px; 
            font-weight: bold; font-size: 1.1rem;
        }
        .btn-retake { background: #6c757d; }
        .btn-save { background: #0d6efd; font-size: 1.3rem; }

    </style>
</head>
<body>

    <div id="update-notification">
        新しいバージョンが利用可能です
        <button id="update-btn" onclick="updateApp()">更新する</button>
    </div>

    <div id="toast"></div>

    <div id="portrait-warning">
        <h1>📱くるっと回転</h1>
        <p>’縦向きロック’を解除してください</p>
        <p>スマホを’横向き’にしてください</p>        
    </div>

    <div id="previewOverlay">
        <img id="previewImg" src="">
        <div class="preview-btns">
            <button class="preview-action-btn btn-save" onclick="savePhoto()">💾 保存</button>
            <button class="preview-action-btn btn-retake" onclick="cancelPreview()">↩ 撮直</button>
        </div>
    </div>

    <div class="app-container">
        <div class="camera-area" id="cameraArea">
            <div id="circleHint">2mポールの【上端】をタップ</div>
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
            <canvas id="outputCanvas"></canvas>
        </div>

        <div class="control-panel">
            <div class="tab-header">
                <button class="tab-btn active" onclick="switchTab('shoot')" id="tabBtn-shoot">📸 撮影</button>
                <button class="tab-btn" onclick="switchTab('edit')" id="tabBtn-edit">📝 記入</button>
            </div>

            <div id="tab-shoot" class="tab-content active">
                <h6 class="text-center text-muted border-bottom pb-2">撮影設定 v2.4</h6>
                
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label style="font-size:0.9rem;">黒板位置</label>
                    <div class="pos-switch" style="width: 60%;">
                        <div class="pos-btn" onclick="setBoardPos('left')" id="btnLeft">左下</div>
                        <div class="pos-btn active" onclick="setBoardPos('right')" id="btnRight">右下</div>
                    </div>
                </div>

                <div class="form-check form-switch border-bottom pb-2 mb-2">
                    <input class="form-check-input" type="checkbox" id="gpsToggle" onchange="toggleGPS()">
                    <label class="form-check-label ms-2 mt-1" for="gpsToggle" style="font-size:1rem;">📍 位置・方位情報</label>
                    <div id="gpsStatus" class="gps-status">OFF</div>
                </div>

                <div class="form-check form-switch border-bottom pb-2 mb-2">
                    <input class="form-check-input" type="checkbox" id="noBoardToggle">
                    <label class="form-check-label ms-2 mt-1" for="noBoardToggle" style="font-size:1rem;">🚫 小黒板を非表示</label>
                    <div class="text-muted ms-2" style="font-size:0.75rem;">※自前の小黒板を使う場合（GPSは記録）</div>
                </div>

                <div class="form-check form-switch border-bottom pb-3 mb-3">
                    <input class="form-check-input" type="checkbox" id="circleToggle" onchange="toggleCircleMode()">
                    <label class="form-check-label ms-2 mt-1" for="circleToggle" style="font-size:1rem; color:#ffd700;">⭕ 5.6m円を描画</label>
                    <div class="text-muted ms-2" style="font-size:0.75rem;">※画面で2mポールの上下をタップ</div>
                </div>

                <div class="mb-3">
                    <label class="text-muted small mb-1">画角 (アスペクト比)</label>
                    <div class="btn-group w-100 ratio-group" role="group">
                        <input type="radio" class="btn-check" name="ratio" id="r169" autocomplete="off" onchange="setRatio(1.7777)">
                        <label class="btn btn-outline-light" for="r169">16:9</label>

                        <input type="radio" class="btn-check" name="ratio" id="r43" autocomplete="off" checked onchange="setRatio(1.3333)">
                        <label class="btn btn-outline-light" for="r43">4:3</label>

                        <input type="radio" class="btn-check" name="ratio" id="r11" autocomplete="off" onchange="setRatio(1.0)">
                        <label class="btn btn-outline-light" for="r11">1:1</label>
                    </div>
                </div>
                
                <div style="flex-grow: 1;"></div>
                <button class="shutter-btn-large" onclick="takeSnapshot()">
                    <span style="font-size: 2.5rem;">📸</span> 撮影
                </button>
                <p class="text-center text-muted" style="font-size:0.7rem; margin-bottom:5px;">iPhoneは保存後に「画像を保存」</p>
            </div>

            <div id="tab-edit" class="tab-content">
                <h6 class="text-center text-muted border-bottom pb-2">黒板編集</h6>
                <div class="preset-box">
                    <label>定型文 (工事名・工種)</label>
                    <select id="presetSelect" class="form-control form-control-sm mb-1">
                        <option value="1">定型文 1</option>
                        <option value="2">定型文 2</option>
                        <option value="3">定型文 3</option>
                        <option value="4">定型文 4</option>
                        <option value="5">定型文 5</option>
                    </select>
                    <div class="preset-btn-group">
                        <button class="preset-btn btn-load" onclick="loadPreset()">📂 読込</button>
                        <button class="preset-btn btn-save" onclick="savePreset()">💾 保存</button>
                    </div>
                </div>
                <div><label>1. 工事名</label><input type="text" id="input1" class="form-control form-control-sm" value="R7年度 作業道開設"></div>
                <div><label>2. 工種</label><input type="text" id="input2" class="form-control form-control-sm" value="路網作設工"></div>
                <div><label>3. 測点</label><input type="text" id="input3" class="form-control form-control-sm" value="No.0"></div>
                <div><label>4. 日付・備考</label><input type="text" id="input4" class="form-control form-control-sm" value=""></div>
                <div class="mt-3 text-center text-muted" style="font-size:0.8rem;">※入力内容は「撮影」タブに戻っても保持されます</div>
            </div>
        </div>
    </div>

<script>
    // --- Update Notification Logic ---
    let newWorker;
    function updateApp() {
        if (newWorker) {
            newWorker.postMessage({ type: 'SKIP_WAITING' });
        }
        document.getElementById('update-notification').style.display = 'none';
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').then(reg => {
            reg.addEventListener('updatefound', () => {
                newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        document.getElementById('update-notification').style.display = 'block';
                    }
                });
            });
        });
        let refreshing;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            window.location.reload();
            refreshing = true;
        });
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show";
        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2500);
    }

    function switchTab(tabName) {
        document.getElementById('tabBtn-shoot').className = (tabName === 'shoot') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabBtn-edit').className = (tabName === 'edit') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tab-shoot').className = (tabName === 'shoot') ? 'tab-content active' : 'tab-content';
        document.getElementById('tab-edit').className = (tabName === 'edit') ? 'tab-content active' : 'tab-content';
    }

    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const warning = document.getElementById('portrait-warning');
    const gpsStatusDiv = document.getElementById('gpsStatus');
    const previewOverlay = document.getElementById('previewOverlay');
    const previewImg = document.getElementById('previewImg');
    
    let currentBlob = null;
    const today = new Date();
    document.getElementById('input4').value = today.getFullYear() + '/' + (today.getMonth()+1) + '/' + today.getDate();

    // --- Aspect Ratio Logic ---
    let targetRatio = 1.3333; // 初期値 4:3
    function setRatio(val) { targetRatio = val; }

    let boardPosition = 'right';
    function setBoardPos(pos) {
        boardPosition = pos;
        document.getElementById('btnLeft').className = pos === 'left' ? 'pos-btn active' : 'pos-btn';
        document.getElementById('btnRight').className = pos === 'right' ? 'pos-btn active' : 'pos-btn';
    }

    function checkOrientation() {
        warning.style.display = (window.innerWidth < window.innerHeight) ? 'flex' : 'none';
    }
    window.addEventListener('resize', checkOrientation);
    checkOrientation();

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                overlayCanvas.width = video.videoWidth;
                overlayCanvas.height = video.videoHeight;
            };
        } catch (err) { 
            console.error("カメラ起動エラー: " + err.message); 
        }
    }
    window.onload = startCamera;

    // --- 5.6m 円描画（ARポール計測）ロジック ---
    let useCircle = false;
    let circleTaps = [];

    function toggleCircleMode() {
        useCircle = document.getElementById('circleToggle').checked;
        document.getElementById('circleHint').style.display = useCircle ? 'block' : 'none';
        resetCircle();
    }

    function resetCircle() {
        circleTaps = [];
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        updateCircleHint();
    }

    function updateCircleHint() {
        if (!useCircle) return;
        const hint = document.getElementById('circleHint');
        if (circleTaps.length === 0) hint.innerText = "2mポールの【上端】をタップ";
        else if (circleTaps.length === 1) hint.innerText = "2mポールの【下端】をタップ";
        else hint.innerText = "📸 撮影OK (再タップでやり直し)";
    }

    document.getElementById('cameraArea').addEventListener('click', function(e) {
        if (!useCircle) return;
        
        // 3回目のタップでやり直し（リセット）
        if (circleTaps.length >= 2) {
            circleTaps = [];
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }
        
        const rect = video.getBoundingClientRect();
        const elemW = rect.width;
        const elemH = rect.height;
        const vidW = video.videoWidth;
        const vidH = video.videoHeight;
        const elemRatio = elemW / elemH;
        const vidRatio = vidW / vidH;

        let drawW, drawH, offsetX = 0, offsetY = 0;
        if (elemRatio > vidRatio) {
            drawH = elemH;
            drawW = drawH * vidRatio;
            offsetX = (elemW - drawW) / 2;
        } else {
            drawW = elemW;
            drawH = drawW / vidRatio;
            offsetY = (elemH - drawH) / 2;
        }

        const clickX = e.clientX - rect.left - offsetX;
        const clickY = e.clientY - rect.top - offsetY;

        // ビデオ領域内をクリックした場合のみ記録
        if (clickX >= 0 && clickX <= drawW && clickY >= 0 && clickY <= drawH) {
            const actualX = (clickX / drawW) * vidW;
            const actualY = (clickY / drawH) * vidH;
            circleTaps.push({x: actualX, y: actualY});
            drawOverlay();
            updateCircleHint();
        }
    });

    function drawOverlay() {
        // iPhone特有の解像度ズレ防止処理：描画直前に必ず同期させる
        if (overlayCanvas.width !== video.videoWidth || overlayCanvas.height !== video.videoHeight) {
            overlayCanvas.width = video.videoWidth;
            overlayCanvas.height = video.videoHeight;
        }
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        drawCircleFeatures(overlayCtx, 0, 0); 
    }

    // AR描画の共通関数（プレビュー用 ＆ 最終保存用）
    function drawCircleFeatures(context, offsetX, offsetY) {
        if (circleTaps.length === 0) return;

        context.save();
        context.translate(offsetX, offsetY); 

        // タップ点1
        context.fillStyle = "red";
        context.beginPath();
        context.arc(circleTaps[0].x, circleTaps[0].y, 10, 0, Math.PI*2);
        context.fill();

        if (circleTaps.length > 1) {
            // タップ点2
            context.beginPath();
            context.arc(circleTaps[1].x, circleTaps[1].y, 10, 0, Math.PI*2);
            context.fill();

            // 2mポールの線
            context.beginPath();
            context.moveTo(circleTaps[0].x, circleTaps[0].y);
            context.lineTo(circleTaps[1].x, circleTaps[1].y);
            context.strokeStyle = "red";
            context.lineWidth = 5;
            context.stroke();

            // 半径計算 (2mの長さから5.6mの長さを算出 = 2.8倍)
            const dx = circleTaps[1].x - circleTaps[0].x;
            const dy = circleTaps[1].y - circleTaps[0].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const radius = dist * 2.8; 

            // 中心点は下端とする（Y座標が大きい方）
            const centerX = circleTaps[0].y > circleTaps[1].y ? circleTaps[0].x : circleTaps[1].x;
            const centerY = Math.max(circleTaps[0].y, circleTaps[1].y);

            // 楕円描画（パースペクティブを考慮し、縦幅は横幅の約0.35倍）
            context.beginPath();
            context.ellipse(centerX, centerY, radius, radius * 0.35, 0, 0, 2 * Math.PI);
            context.strokeStyle = "rgba(255, 0, 0, 0.8)";
            context.lineWidth = 5;
            context.stroke();
            
            // 半透明の赤で塗りつぶし
            context.fillStyle = "rgba(255, 0, 0, 0.1)";
            context.fill();

            // テキスト表示
            context.font = "bold 40px sans-serif";
            context.fillStyle = "red";
            context.textAlign = "left";
            context.fillText("2mﾎﾟｰﾙ", circleTaps[0].x + 20, (circleTaps[0].y + circleTaps[1].y)/2);
            context.fillText("半径5.6m", centerX + radius + 20, centerY);
        }
        context.restore();
    }


    // --- Preset Logic ---
    function savePreset() {
        const slot = document.getElementById('presetSelect').value;
        const val1 = document.getElementById('input1').value;
        const val2 = document.getElementById('input2').value;
        localStorage.setItem('preset_' + slot + '_1', val1);
        localStorage.setItem('preset_' + slot + '_2', val2);
        showToast(`定型文${slot}に保存しました`);
    }

    function loadPreset() {
        const slot = document.getElementById('presetSelect').value;
        const val1 = localStorage.
